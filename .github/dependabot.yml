version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Denver"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5
    groups:
      actions-nonmajor:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Major action upgrades remain individual migration PRs.

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/Denver"
    labels:
      - "dependencies"
      - "javascript"
    open-pull-requests-limit: 5
    groups:
      runtime-security:
        applies-to: "security-updates"
        patterns:
          - "next"
          - "react"
          - "react-dom"

      sharp-security:
        applies-to: "security-updates"
        patterns:
          - "sharp"

      runtime-patches:
        applies-to: "version-updates"
        patterns:
          - "next"
          - "react"
          - "react-dom"
        update-types:
          - "patch"

      sharp-patches:
        applies-to: "version-updates"
        patterns:
          - "sharp"
        update-types:
          - "patch"

      dev-tooling-nonmajor:
        applies-to: "version-updates"
        dependency-type: "development"
        patterns:
          - "*"
        exclude-patterns:
          - "sharp"
        update-types:
          - "minor"
          - "patch"
    # Major npm upgrades remain individual migration PRs.

  - package-ecosystem: "pip"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "America/Denver"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/services/pipeline"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:30"
      timezone: "America/Denver"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 5
