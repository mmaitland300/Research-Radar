version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Denver"
    labels:
      - "dependencies"
      - "github-actions"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:30"
      timezone: "America/Denver"
    labels:
      - "dependencies"
      - "javascript"
    open-pull-requests-limit: 5
    groups:
      web-runtime:
        patterns:
          - "next"
          - "react"
          - "react-dom"
      web-tooling:
        dependency-type: "development"

  - package-ecosystem: "pip"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "America/Denver"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 5

  - package-ecosystem: "pip"
    directory: "/services/pipeline"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:30"
      timezone: "America/Denver"
    labels:
      - "dependencies"
      - "python"
    open-pull-requests-limit: 5
