name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python packages and test runner
        run: |
          python -m pip install --upgrade pip
          pip install -e ./services/pipeline
          pip install -e ./apps/api
          pip install pytest httpx

      - name: Run Python unit tests
        run: pytest services/pipeline/tests apps/api/tests -q

  db-migrations:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: research_radar
          POSTGRES_USER: research_radar
          POSTGRES_PASSWORD: research_radar
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U research_radar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install migration tooling
        run: pip install -r infra/db/requirements.txt

      - name: Apply migrations to a clean database
        run: alembic upgrade head
        working-directory: infra/db

      - name: Re-run migrations (must be a no-op at head)
        run: alembic upgrade head
        working-directory: infra/db

      - name: Sanity-check migrated schema
        run: |
          python - <<'EOF'
          import psycopg

          with psycopg.connect("postgresql://research_radar:research_radar@localhost:5432/research_radar") as conn:
              tables = {
                  row[0]
                  for row in conn.execute(
                      "SELECT tablename FROM pg_tables WHERE schemaname = 'public'"
                  )
              }
              expected = {"works", "embeddings", "ranking_runs", "paper_scores", "alembic_version"}
              missing = expected - tables
              assert not missing, f"missing tables after migration: {missing}"
              vector = conn.execute(
                  "SELECT extname FROM pg_extension WHERE extname = 'vector'"
              ).fetchone()
              assert vector, "pgvector extension not installed"
          print("schema sanity check passed")
          EOF

  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install web dependencies
        run: npm install

      - name: Lint web app
        run: npm run lint:web

      - name: Build web app
        run: npm run build:web
