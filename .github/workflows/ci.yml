name: CI

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages and test runner
        run: |
          python -m pip install --upgrade pip
          pip install -e ./services/pipeline
          pip install -e ./apps/api
          pip install pytest httpx

      - name: Run Python unit tests
        run: pytest services/pipeline/tests apps/api/tests -q

      - name: Verify Phase 2 bundle (post-review)
        run: python -m pipeline.cli ml-shadow-scorer-phase-bundle-verify --bundle ../../docs/audit/bundles/phase2-v1/bundle.json --expect-pilot-reviewed
        working-directory: services/pipeline

      - name: Verify production-readiness bundle (post-grant)
        run: python -m pipeline.cli ml-shadow-scorer-production-readiness-bundle-verify --bundle ../../docs/audit/bundles/production-readiness-v1/bundle.json --expect-grant-filed
        working-directory: services/pipeline

      - name: Verify production-scoped-shadow bundle (post-live-execution-pilot-run)
        run: python -m pipeline.cli ml-shadow-scorer-production-scoped-shadow-bundle-verify --bundle ../../docs/audit/bundles/production-scoped-shadow-v1/bundle.json --expect-live-execution-pilot-run-filed
        working-directory: services/pipeline

  web-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install web dependencies
        run: npm install

      - name: Lint web app
        run: npm run lint:web

      - name: Build web app
        run: npm run build:web
